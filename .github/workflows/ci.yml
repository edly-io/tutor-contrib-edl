name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
    - '**'

jobs:
  run_tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: setup python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install tox
      run: pip install tox
    - name: Run tests
      run: tox
